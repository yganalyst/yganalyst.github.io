<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">
    <span class="brand-name">{{ site.title }}</span>
    <span class="workbar" role="progressbar" aria-label="오늘 근무 진행률" aria-valuemin="0" aria-valuemax="100" data-start="10" data-end="19"><span class="workbar-fill"></span></span>
  </a>
  <nav class="nav">
    {%- assign nav = "Posts:/posts/,Lab:/lab/,About:/about/,Contact:/contact/" | split: "," -%}
    {%- for item in nav -%}
      {%- assign kv = item | split: ":" -%}
      <a href="{{ kv[1] | relative_url }}"{% if page.url contains kv[1] %} aria-current="page"{% endif %}>{{ kv[0] }}</a>
    {%- endfor -%}
    <button class="theme-toggle" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>
</header>
