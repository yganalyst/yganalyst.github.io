title: "yg's lab"
description: >-
  데이터 엔지니어 신용근의 기술 노트와 사이드 프로젝트 기록.
url: "https://yganalyst.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul

author:
  name: Yonggeun Shin
  name_ko: 신용근
  role: Data Engineer
  location: Seoul
  github: yganalyst
  instagram: tlsdydrms
  linkedin: https://www.linkedin.com/in/yonggeunshin/

# Google Analytics 4 (production 빌드에서만 로드)
analytics:
  google: G-Z2N5665R1V

# 글 댓글 (기존 댓글이 GitHub Issues 에 있어 utterances 유지)
utterances:
  repo: yganalyst/yganalyst.github.io
  issue_term: pathname

# Contact 폼 전송 주소 (Formspree 등). 비어 있으면 폼이 비활성화됩니다.
contact:
  form_action: ""

# 홈에 보여줄 최근 글 수
home_posts: 8

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax
  auto_ids: true
  footnote_backlink: "↩︎"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

sass:
  style: compressed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      # 2025년 이전 글은 front matter 의 permalink 로 예전 주소를 유지합니다.
      permalink: /posts/:title/
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - "*.gem"
