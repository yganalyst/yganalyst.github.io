---
layout: default
---
<article class="page">
  {% if page.title %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}
  {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  {% if page.prose == false %}{{ content }}{% else %}<div class="prose">
    {{ content }}
  </div>{% endif %}
</article>
